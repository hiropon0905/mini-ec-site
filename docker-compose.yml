services:
  # PostgreSQLデータベース
  db:
    image: postgres:15-alpine
    container_name: mini-ec-db
    environment:
      POSTGRES_USER: ecuser
      POSTGRES_PASSWORD: ecpass123
      POSTGRES_DB: mini_ec_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mini-ec-network

  # バックエンド（Express + TypeScript）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini-ec-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://ecuser:ecpass123@db:5432/mini_ec_db
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev
    networks:
      - mini-ec-network

  # フロントエンド（Next.js + TypeScript）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini-ec-frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
    networks:
      - mini-ec-network

volumes:
  postgres_data:

networks:
  mini-ec-network:
    driver: bridge
